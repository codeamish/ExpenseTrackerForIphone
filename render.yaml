services:
  - type: web
    name: expense-tracker-iphone-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci && npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        value: https://expensetrackerforiphone.netlify.app
      - key: TRUST_PROXY
        value: "1"
